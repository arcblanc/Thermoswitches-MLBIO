name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: |
          uv sync --group dev --group biophysics --group notebooks --group cloud --group llm

      - name: Ruff lint
        run: uv run ruff check src scripts notebooks tests

      - name: Ruff format
        run: uv run ruff format --check src scripts notebooks tests

      - name: Type check (ty)
        run: uv check

      - name: Pytest
        run: uv run pytest tests/ -v --tb=short
