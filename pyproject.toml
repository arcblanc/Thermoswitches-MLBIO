[project]
name = "thermoswitches-mlbio"
version = "0.1.0"
description = "RNA thermoswitch biophysics, Random Forest ranking, and EVA generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python",
    "pandas",
    "biopython",
    "python-dotenv",
    "imbalanced-learn",
    "scikit-learn",
    "scipy",
    "psutil",
    "matplotlib",
    "seaborn",
    "xgboost",
    "joblib",
    "marimo>=0.24.0",
    "altair>=6.2.2",
    "plotly>=6.9.0",
    "umap-learn>=0.5.12",
    "pyarrow>=25.0.1",
    "great-tables>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/data_engineering",
    "src/de_novo_hallucinations",
    "src/novelty_eval",
    "src/thermo_sim",
    "src/validation_embedding",
]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.12"
stubPath = "typings"

[tool.basedpyright]
extraPaths = ["src"]
pythonVersion = "3.12"
stubPath = "typings"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "scripts", "notebooks", "tests"]
exclude = ["data", "nupack-4.1.0.1", "**/__pycache__"]

[tool.ty.analysis]
# Optional / manual-install modules — suppress unresolved-import without type: ignore.
allowed-unresolved-imports = [
    "nupack",
    "nupack.**",
    "google.cloud",
    "google.cloud.**",
    "IPython",
    "IPython.**",
    "RNA",
]
replace-imports-with-any = [
    "nupack",
    "nupack.**",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
src = ["src", "scripts", "notebooks", "tests"]
extend-exclude = ["data", "nupack-4.1.0.1"]
# Jupyter notebooks are linted/formatted by default in Ruff ≥0.6; keep them explicit.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Ruff core defaults: pycodestyle subset (E4/E7/E9) + Pyflakes (F).
# D103: public functions require a docstring (pydocstyle, bundled in Ruff).
select = ["E4", "E7", "E9", "F", "D103"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# CLI modules insert src/ onto sys.path before local imports.
"src/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
# Jupyter cells and Marimo apps insert src/ onto sys.path (imports after magics/path hacks).
"*.ipynb" = ["E402"]
"notebooks/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.marimo.package_management]
manager = "uv"

[tool.pymarkdown]
# Layout-friendly linting for sparse visual-anchoring markdown
# (trailing spaces, short solo lines, flexible heading blanks).
extensions.markdown-tables.enabled = true
# Disable rules that force long paragraphs or block joins
plugins.MD009.enabled = false  # Allows trailing spaces (great for custom spacing)
plugins.MD013.enabled = false  # Disable line-length limits so short text can sit alone
plugins.MD022.enabled = false  # Allow flexible spacing around headings

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.39",
    "pytest>=8.0",
    "ruff>=0.12",
]
biophysics = [
    "viennarna>=2.7",
]
notebooks = [
    "ipython>=8.0",
    "nbclient>=0.10",
    "nbconvert>=7.0",
    "nbformat>=5.10",
    "playwright>=1.40",
]
llm = [
    "accelerate>=0.30",
    "einops>=0.8",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "tokenizers>=0.19",
    "torch>=2.1",
    "transformers>=4.40",
]
cloud = [
    "boto3>=1.34",
]
