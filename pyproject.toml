[project]
name = "thermoswitches-mlbio"
version = "0.1.0"
description = "RNA thermoswitch biophysics, Random Forest ranking, and EVA generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python",
    "pandas",
    "biopython",
    "python-dotenv",
    "imbalanced-learn",
    "scikit-learn",
    "scipy",
    "psutil",
    "matplotlib",
    "seaborn",
    "xgboost",
    "joblib",
    "marimo>=0.24.0",
    "altair>=6.2.2",
    "plotly>=6.9.0",
    "umap-learn>=0.5.12",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
src = ["src", "scripts", "notebooks"]
extend-exclude = ["data", "nupack-4.1.0.1"]
# Jupyter notebooks are linted/formatted by default in Ruff ≥0.6; keep them explicit.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Ruff core defaults: pycodestyle subset (E4/E7/E9) + Pyflakes (F).
# D103: public functions require a docstring (pydocstyle, bundled in Ruff).
select = ["E4", "E7", "E9", "F", "D103"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# CLI modules insert src/ onto sys.path before local imports.
"src/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
# Jupyter cells and Marimo apps insert src/ onto sys.path (imports after magics/path hacks).
"*.ipynb" = ["E402"]
"notebooks/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.marimo.package_management]
manager = "uv"

[dependency-groups]
dev = [
    "ruff>=0.12",
]
